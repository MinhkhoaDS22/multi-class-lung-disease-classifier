<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MediScan AI - Ứng dụng phân tích ảnh X-quang ngực bằng trí tuệ nhân tạo. Phát hiện COVID, Xơ phổi, Mờ phổi và Viêm phổi với độ chính xác 91.76%.">
  <meta name="keywords" content="X-quang, AI, chẩn đoán, COVID, phổi, MediScan">
  <meta name="theme-color" content="#050E1A">

  <!-- iOS meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MediScan AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MediScan AI – Phân tích X-quang ngực</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #050E1A;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #050E1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: 'Inter', sans-serif;
    }
    .loader-ring {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(0,180,216,0.15);
      border-top-color: #00B4D8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loader-text {
      margin-top: 20px;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    .loader-brand {
      margin-top: 8px;
      color: #00B4D8;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loader-ring"></div>
    <div class="loader-brand">MediScan AI</div>
    <div class="loader-text">Đang tải ứng dụng...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.transition = 'opacity 0.5s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
